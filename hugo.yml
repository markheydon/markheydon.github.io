baseURL: "https://markheydon.me.uk/"
locale: "en-GB"
title: "Mark Heydon - Software Engineer"
enableRobotsTXT: true

caches:
  images:
    dir: :cacheDir/images

pagination:
  pagerSize: 8

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

menus:
  main:
    - identifier: blog
      name: "Blog"
      url: "/blog/"
      weight: 1

module:
  imports:
    - path: github.com/gurusabarish/hugo-profile
params:
  description: "Software engineer building and maintaining open-source tools for Microsoft 365 and small-business workflows. C#, .NET, Blazor, PHP, and Azure."
  author: "Mark Heydon"
  favicon: "/favicon.ico"

  animate: true

  singlePages:
    socialShare: false
    scrollProgress:
      enable: true

  font:
      fontSize: 1rem
      fontWeight: 500
      lineHeight: 1.5

  color:
    textColor: "#111827"            # Very dark grey for main text (better than pure black)
    secondaryTextColor: "#4b5563"   # Medium grey for secondary text
    backgroundColor: "#ffffff"      # White background
    primaryColor: "#00bfa6"         # Teal accent (consistent with your brand)
    secondaryColor: "#f3f4f6"       # Light grey for cards (soft contrast, not overwhelming)

    darkmode:
      textColor: "#ffffff"            # White for main text
      secondaryTextColor: "#d1d5db"   # Light grey for secondary text
      backgroundColor: "#121212"      # Deep charcoal
      primaryColor: "#00bfa6"         # Teal accent (matches your main site)
      secondaryColor: "#1f2937"       # Dark grey for cards (instead of orange)

  hero:
    enable: true
    intro: "Welcome to my profile site!"
    title: "Mark Heydon"
    subtitle: "C#/.NET developer. Open-source tools for Microsoft 365 and small-business workflows."
    image: "/images/profile.png"
    button:
      enable: true
      name: "View My Projects"
      url: "/projects/"
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: "https://github.com/markheydon"
        - icon: fab fa-linkedin
          url: "https://linkedin.com/in/markheydon"
        - icon: fas fa-globe
          url: "https://markheydon.co.uk"

  about:
    enable: true
    title: "About Me"
    image: "/images/profile.png"
    content: |-
      I'm a software engineer with a BSc in Software Engineering from the Open University and decades of professional development experience.

      A significant part of my work is open source: products and libraries I design, ship, and keep maintained. They exist because the problems are real — running a fleet of GitHub repositories, importing work into Microsoft Planner, talking to FreeAgent from .NET, logging WordPress CLI jobs properly. Microsoft 365 is a domain I still build in, not a consultancy offering on this site.
    skills:
      enable: true
      title: "Tools and platforms I use to build and maintain that work:"
      items:
        - "C#"
        - ".NET"
        - "Blazor"
        - "Microsoft Graph"
        - "Azure"
        - "Bicep"
        - "PHP"
        - "WordPress"
        - "GitHub"
        - "Hugo"
        - "Aspire"
        - "Dataverse"

  contact:
    enable: true
    content: "If you want to talk about a project or an open-source tool, email me."
    email: "hello@markheydon.co.uk"
    btnName: "Email Me"

  projects:
    enable: true
    title: "My Projects"

  footer:
    recentPosts:
      enable: true
      title: "Recent Posts"
      count: 3
      path: "blog"
    socialNetworks:
      github: "https://github.com/markheydon"
      linkedin: "https://linkedin.com/in/markheydon"