baseURL: "https://markheydon.me.uk/"
locale: "en-GB"
title: "Mark Heydon - Software Engineer"
enableRobotsTXT: true

caches:
  images:
    dir: :cacheDir/images

pagination:
  pagerSize: 8

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

menus:
  main:
    - identifier: blog
      name: "Blog"
      url: "/blog/"
      weight: 1

module:
  imports:
    - path: github.com/gurusabarish/hugo-profile
params:
  description: "Solo software engineer building practical tools for Microsoft 365 Business and small-business day-to-day work. C#/.NET, open source, AI in the loop."
  author: "Mark Heydon"
  favicon: "/favicon.ico"

  animate: true

  singlePages:
    socialShare: false
    scrollProgress:
      enable: true

  font:
      fontSize: 1rem
      fontWeight: 500
      lineHeight: 1.5

  color:
    textColor: "#111827"            # Very dark grey for main text (better than pure black)
    secondaryTextColor: "#4b5563"   # Medium grey for secondary text
    backgroundColor: "#ffffff"      # White background
    primaryColor: "#00bfa6"         # Teal accent (consistent with your brand)
    secondaryColor: "#f3f4f6"       # Light grey for cards (soft contrast, not overwhelming)

    darkmode:
      textColor: "#ffffff"            # White for main text
      secondaryTextColor: "#d1d5db"   # Light grey for secondary text
      backgroundColor: "#121212"      # Deep charcoal
      primaryColor: "#00bfa6"         # Teal accent (matches your main site)
      secondaryColor: "#1f2937"       # Dark grey for cards (instead of orange)

  hero:
    enable: true
    intro: "Welcome to my profile site!"
    title: "Mark Heydon"
    subtitle: "Solo C#/.NET developer"
    content: "Practical tools for Microsoft 365 Business and small-business ops, built with AI in the loop so more actually ships."
    image: "/images/profile.png"
    button:
      enable: true
      name: "View My Projects"
      url: "/projects/"
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: "https://github.com/markheydon"
        - icon: fab fa-linkedin
          url: "https://linkedin.com/in/markheydon"
        - icon: fas fa-globe
          url: "https://markheydon.co.uk"

  about:
    enable: true
    title: "About Me"
    image: "/images/profile.png"
    content: |-
      I'm a software engineer, self-taught from an early age, who later formalised that with a Software Engineering degree from the Open University. Decades of professional development and commercial experience.

      I build practical tools for smaller businesses' day-to-day operations, with a particular focus on Microsoft 365 Business technologies. I'm passionate about open source work: design it, ship it, keep it maintained, because the problems are real. I maintain a fleet of GitHub repositories: importing work into Microsoft Planner, talking to FreeAgent from .NET, logging WordPress CLI jobs properly. Sponsorship and paid work help fund that, although I'm not pretending open source alone pays the bills. As a solo developer I use AI coding tools openly: not instead of knowing how to build, but so more of the right work actually ships. These days that's mainly C#/.NET and PowerShell, with WordPress still in the mix. I keep current with things like .NET Aspire.
    skills:
      enable: true
      title: "Tools and platforms I use to build and maintain that work:"
      items:
        - "C#"
        - ".NET"
        - "PowerShell"
        - "Blazor"
        - "Microsoft Graph"
        - "Azure"
        - "Bicep"
        - "PHP"
        - "WordPress"
        - "GitHub"
        - "Hugo"
        - "Aspire"
        - "Dataverse"

  contact:
    enable: true
    content: "If you want to talk about a project or an open-source tool, email me."
    email: "hello@markheydon.co.uk"
    btnName: "Email Me"

  projects:
    enable: true
    title: "My Projects"

  footer:
    recentPosts:
      enable: true
      title: "Recent Posts"
      count: 3
      path: "blog"
    socialNetworks:
      github: "https://github.com/markheydon"
      linkedin: "https://linkedin.com/in/markheydon"